<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>TaxiAshot — Dota 2 Team</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #1e1e1e;
      color: #f0f0f0;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #ffcc00;
      padding: 20px;
      text-align: center;
    }
    header img {
      height: 100px;
    }
    h1 {
      margin-top: 10px;
      font-size: 2.5em;
      color: #1e1e1e;
    }
    main {
      padding: 40px;
      max-width: 800px;
      margin: auto;
    }
    .player-list {
      list-style: none;
      padding: 0;
    }
    .player {
      background-color: #2e2e2e;
      margin-bottom: 15px;
      padding: 15px;
      border-radius: 8px;
      border-left: 5px solid #ffcc00;
    }
    .role {
      font-style: italic;
      color: #cccccc;
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.jpg" alt="Логотип TaxiAshot">
    <h1>Команда TaxiAshot — Dota 2</h1>
  </header>
  <main>
    <h2>Состав команды</h2>
    <ul class="player-list">
      <li class="player">
        <strong>Vlantony666</strong> — <span class="role">Керри</span>
      </li>
      <li class="player">
        <strong>Gesslor</strong> — <span class="role">Мид</span>
      </li>
      <li class="player">
        <strong>teplovkyy</strong> — <span class="role">Оффлейн</span>
      </li>
      <li class="player">
        <strong>scvrxcrxw</strong> — <span class="role">Саппорт</span>
      </li>
      <li class="player">
        <strong>fantazytx</strong> — <span class="role">Хард-саппорт</span>
      </li>
    </ul>
  </main>
</body>
</html>
